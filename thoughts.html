---
layout: default
title: Thoughts
---

<h1>Thoughts</h1>

{% assign posts = site.posts | where_exp: "post", "post.categories contains 'thoughts'" %}

{% for post in posts %}

<article>
  <a href="{{ post.url | relative_url }}">
    {{ post.title }}
  </a>

  <time>{{ post.date | date: "%Y.%m.%d" }}</time>
</article>

{% endfor %}
