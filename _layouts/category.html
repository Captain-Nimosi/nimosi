<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>{{ page.title }}</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;500&display=swap');
  body {
    font-family: 'Noto Serif', serif;
    font-size: 14px;
    color: #111;
    background: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
  }
  .post-list { text-align: center; line-height: 2.2; }
  a { color: #111; text-decoration: none; }
  a:hover { text-decoration: underline; }
  .back { margin-top: 40px; font-size: 12px; opacity: 0.6; }
</style>
</head>
<body>
  <div class="post-list">
    {% assign posts = site.categories[page.category_name] %}
    {% for post in posts %}
      <div><a href="{{ post.url }}">{{ post.title }}</a></div>
    {% endfor %}
  </div>
  <div class="back"><a href="/">← home</a></div>
</body>
</html>
