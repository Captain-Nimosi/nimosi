<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>{{ page.title }}</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;500&display=swap');
  body {
    font-family: 'Noto Serif', serif;
    font-size: 14px;
    color: #111;
    background: #fff;
    margin: 0;
    padding: 60px 40px;
  }
  .post-list { text-align: left; line-height: 2.2; }
  a { color: #111; text-decoration: none; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="post-list">
    {% assign posts = site.categories[page.category_name] %}
    {% for post in posts %}
      <div><a href="{{ post.url | relative_url }}">{{ post.title }}</a></div>
    {% endfor %}
  </div>
</body>
</html>
