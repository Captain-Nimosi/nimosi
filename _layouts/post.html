<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<title>{{ page.title }}</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&display=swap');


body {

  font-family: 'Noto Serif', serif;

  font-size: 14px;

  color: #111;

  background: #fff;

  margin: 0;

  padding: 60px 40px;

}


/* Page title */

.page-title {

  font-weight: 700;

  font-size: 16px;

  margin-bottom: 20px;

}


/* Page / Post content */

.post-content {

  line-height: 1.8;

  max-width: 600px;

}


/* Archive list */

.archive-list {

  line-height: 1.8;

}


/* General links */

a {

  color: #0000EE;

  text-decoration: underline;

}


a:hover {

  color: #0000AA;

}


/* Back */

.back {

  margin-top: 60px;

}


.back a {

  color: #111;

  text-decoration: underline;

}


/* =================================
   SEARCH
   ================================= */


/* Search container */

.search-container {
  display: inline-block;
  width: 200px;
  height: 24px;
}


/* Normal "search" text */

.search-label {
  display: block;
  box-sizing: border-box;
  width: 200px;
  height: 24px;
  padding: 0;
  color: #0000EE;
  border-bottom: 1px solid #111;
  cursor: default;
}


/* Search input is hidden by default */

.search-input-wrapper {
  display: none;
  align-items: flex-start;
  width: 200px;
  height: 24px;
}


/* Hover:
   search → search input */

.search-container:hover .search-label {
  display: none;
}

.search-container:hover .search-input-wrapper {
  display: flex;
}


/* After search:
   keep search input visible */

.search-container.search-active .search-label {
  display: none;
}


.search-container.search-active .search-input-wrapper {
  display: flex;
}



/* Search input */

#search-input {
  box-sizing: border-box;
  font-family: 'Noto Serif', serif;
  font-size: 14px;
  color: #111;
  border: none;
  border-bottom: 1px solid #111;
  outline: none;
  width: 200px;
  height: 24px;
  padding: 0;
  background: transparent;
}


/* Go button */

#search-button {
  font-family: 'Noto Serif', serif;
  font-size: 14px;
  color: #0000EE;
  background: none;
  border: none;
  padding: 0;
  margin-left: 10px;
  text-decoration: underline;
  cursor: pointer;
}


#search-button:hover {
  color: #0000AA;
}


/* Search results */

.search-result {
  margin-bottom: 20px;
}

.search-result-header {
  display: flex;
  align-items: baseline;
  gap: 6px;
}

.search-result-category {
  font-size: 12px;
  color: #555;
}

.search-snippet {
  font-size: 12px;
  color: #555;
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 600px;
}

.search-snippet mark {
  background: none;
  color: #0000EE;
  font-weight: 700;
}

</style>

</head>


<body>


<div class="page-title">

  {{ page.title }}

</div>


<div class="post-content">

  {{ content }}

</div>


<div class="back">

  <a href="javascript:history.back()">back</a>

</div>


</body>

</html>
