<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>{{ page.title }}</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&display=swap');

  body {
    font-family: 'Noto Serif', serif;
    font-size: 14px;
    color: #111;
    background: #fff;
    margin: 0;
    padding: 60px 40px;
  }

  .archive-list {
  line-height: 1.8;
  }

  .page-title {
    font-weight: 700;
    font-size: 16px;
    margin-bottom: 20px;
  }

  .post-content {
    line-height: 1.8;
    max-width: 600px;
  }

  .search-box {
  margin-bottom: 30px;
  }

  .search-container {
  display: inline-block;
  }

.search-label {
  cursor: default;
  }

.search-input-wrapper {
  display: none;
  margin-top: 8px;
  align-items: center;
  }

.search-container:hover .search-input-wrapper {
  display: flex;
  }
  
  #search-input {
    font-family: 'Noto Serif', serif;
    font-size: 14px;
    border: none;
    border-bottom: 1px solid #111;
    outline: none;
    width: 200px;
    padding: 4px 0;
    background: transparent;
   }

  #search-button {
    font-family: 'Noto Serif', serif;
    font-size: 14px;
    color: #0000EE;
    background: none;
    border: none;
    padding: 0;
    margin-left: 10px;
    text-decoration: underline;
    cursor: pointer;
  }

  #search-button:hover {
    color: #0000AA;
   }

  #search-input::placeholder {
    color: #111;
  }

  .search-result {
    margin-bottom: 20px;
  }

  .search-result div:first-child {
    margin-bottom: 2px;
  }

  .search-result div:last-child {
    font-size: 14px;
  }
  
  a {
    color: #0000EE;
    text-decoration: underline;
  }

  a:hover {
    color: #0000AA;
  }

  .back a {
    color: #111;
    text-decoration: underline;
  }

  .back {
    margin-top: 60px;
  }
</style>
</head>

<body>
  <div class="page-title">{{ page.title }}</div>

  <div class="post-content">{{ content }}</div>

  <div class="back">
  {% if page.back_url %}
    <a href="{{ site.baseurl }}{{ page.back_url }}">back</a>
  {% else %}
    <a href="{{ site.baseurl }}/{{ page.categories | first }}/">back</a>
  {% endif %}
  </div>
</body>
</html>
