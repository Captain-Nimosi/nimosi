<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>{{ page.title }}</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&display=swap');

  body {
    font-family: 'Noto Serif', serif;
    font-size: 14px;
    color: #111;
    background: #fff;
    margin: 0;
    padding: 60px 40px;
  }

  .page-title {
    font-weight: 700;
    font-size: 16px;
    margin-bottom: 20px;
  }

  .links {
    line-height: 1.8;
  }

  a {
    color: #0000EE;
    text-decoration: underline;
  }

  a:hover {
    color: #0000AA;
  }
</style>
</head>

<body>
  <div class="page-title">{{ site.title }}</div>

  <div class="links">
    <div><a href="{{ site.baseurl }}/about/">about</a></div>
    <div><a href="{{ site.baseurl }}/archive/">archive</a></div>
    <div><a href="{{ site.baseurl }}/search/">search</a></div>
  </div>
</body>
</html>
