<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>{{ page.title }}</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;500&display=swap');
  body {
    font-family: 'Noto Serif', serif;
    font-size: 14px;
    color: #111;
    background: #fff;
    margin: 0;
    padding: 60px 40px;
  }
  .page-title { font-weight: 700; margin-bottom: 16px; }
  .links { line-height: 2.2; }
  a { color: #111; text-decoration: none; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="page-title">{{ page.title }}</div>
  <div class="links">
    {% assign cats = site.categories | sort %}
    {% for cat in cats %}
      <div><a href="{{ site.baseurl }}/{{ cat[0] }}/">{{ cat[0] }}</a></div>
    {% endfor %}
  </div>
</body>
</html>
